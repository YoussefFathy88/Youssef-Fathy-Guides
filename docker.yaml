services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      # Host .next (e.g. from Windows) must not be used inside Linux — breaks dev routing (404s on most routes).
      - /app/.next
    environment:
      WATCHPACK_POLLING: "true"
    command: npm run dev -- --hostname 0.0.0.0 --port 3000
